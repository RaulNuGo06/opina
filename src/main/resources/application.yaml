spring:
  application:
    name: opina
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opina}
    username: ${DB_USER:opina}
    password: ${DB_PASSWORD:opina}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway; Hibernate solo comprueba que las entidades encajan con él
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

opina:
  jwt:
    # Al menos 32 caracteres. Si falta, se genera uno aleatorio en cada arranque (solo para desarrollo)
    secreto: ${JWT_SECRET:}
    duracion: 8h

  ia:
    # Sin clave, la aplicación funciona igual pero no clasifica ni resume
    api-key: ${ANTHROPIC_API_KEY:}
    modelo: ${OPINA_IA_MODELO:claude-opus-5-5}
    # Cada cuánto se buscan opiniones nuevas para clasificar
    intervalo: ${OPINA_IA_INTERVALO:PT10S}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /docs

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
