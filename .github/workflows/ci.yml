name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testcontainers levanta PostgreSQL con el Docker que ya trae el runner
      - name: Compilar y pasar los tests
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Formato (Prettier)
        run: npx prettier --check "src/**/*.{ts,html,css}"
      - name: Tests (Vitest)
        run: npx ng test --watch=false
      - name: Compilar para producción
        run: npx ng build
