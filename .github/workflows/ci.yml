name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Testcontainers levanta PostgreSQL con el Docker que ya trae el runner
      - name: Compilar y pasar los tests
        run: ./mvnw -B verify
